<div *ngIf="event" class="card">
    <div class="card-content">
        <p class="mono">
            forked
            <a [href]="'https://github.com/' + event.repo.name">{{event.repo.name}}</a>
        </p>
        <p class="top-right">{{event.created_at | dateAgo}}</p>
        <h5 class="mb-0">
            <i class="fas fa-code-branch"></i>
            <a [href]="'https://github.com/' + event.payload.forkee.full_name">
                {{event.payload.forkee.full_name}}
            </a>
        </h5>
    </div>
</div>
