<div *ngIf="event" class="card">
    <div class="card-content">
        <p class="mono">
            forked
            <a [href]="event.repo.url">{{event.repo.name.slice(0, 19)}}{{event.repo.name.length > 18 ? '...' : ''}}</a>
        </p>
        <p class="top-right">{{event.created_at | dateAgo}}</p>
        <h5 class="mb-0">
            <i class="fas fa-code-branch"></i>
            <a [href]="event.payload.forkee.url">
                {{event.payload.forkee.full_name}}
            </a>
        </h5>
    </div>
</div>
