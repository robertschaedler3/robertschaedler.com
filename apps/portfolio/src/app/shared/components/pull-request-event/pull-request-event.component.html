<div *ngIf="event" class="card">
    <div class="card-content">
        <p>{{getPullRequestAction(event.payload.action, event.payload.pull_request)}} pull request</p>
        <p>{{event.repo.name}}</p>
        <p>{{event.payload.pull_request.head.ref}} into {{event.payload.pull_request.base.ref}}</p>
        <p>{{getTimestamp(event.payload.action, event.payload.pull_request) | dateAgo}}</p>
    </div>
</div>
