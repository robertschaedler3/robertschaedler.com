<div *ngIf="event" class="card">
    <div class="card-content">
        <p class="mono">
            {{getIssueAction()}} issue
            <a [href]="event.payload.issue.url">
                #{{event.payload.issue.number}}
            </a>
        </p>
        <p class="top-right">{{getTimestamp() | dateAgo}}</p>
        <h4>{{event.payload.issue.title}}</h4>
        <h5 class="mb-0">
            <i class="fas fa-exclamation-circle fa-xs"></i>
            <a [href]="event.repo.url">
                {{event.repo.name}}
            </a>
        </h5>
    </div>
</div>
