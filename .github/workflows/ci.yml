name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with: 
          node-version: '12.x'
      - name: Run tests
        uses: MansaGroup/nrwl-nx-action@v2
        with:
          targets: test
          affected: true
